summary: >-
  A live media console for triggering clips, mixing sources, and running shows.
  Built to perform, not to configure.
features:
  - title: Source
    body: >-
      Bring anything in — video, images, webcams, NDI, phone via QR + WebRTC,
      GLSL shaders, HTML/QML, Lua.
    icon: source
  - title: Canvas
    body: Node-based clip canvas with groups for complex shows.
    icon: canvas
  - title: Mix
    body: A/B mixing, hotkeys, and live triggering from one surface.
    icon: mix
  - title: Output
    body: Panic controls, OBS integration, remote control, multi-output.
    icon: output
