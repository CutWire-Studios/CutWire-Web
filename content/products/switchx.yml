slug: switchx
name: SwitchX
tagline: Trigger. Mix. Create. Live.
status: live
version: "0.1.0"
platforms:
  - macOS
  - Windows
  - Linux
summary: >-
  A beginner-friendly live media trigger and overlay tool built with Qt 6, FFmpeg,
  and OpenGL. Perfect for school events, small concerts, and sports — combining
  instant clip triggering with the power of live visual control.
hero:
  headline: The beginner-friendly live trigger that feels like magic.
  subheadline: >-
    Instant clips. Beautiful overlays. Zero stress. Perfect for school events,
    small concerts, sports, and anywhere you want to look pro — without the headache.
highlights:
  - title: Node-based clip canvas
    description: Visual clip graph with groups, transform contexts, and audio routing — not locked to a fixed grid.
  - title: Live A/B deck mixing
    description: Crossfade between two sources with per-deck speed control and hotkey triggers under 50ms latency.
  - title: Phone camera over WebRTC
    description: Stream a smartphone camera into SwitchX over LAN or a public relay, paired by QR code.
  - title: GLSL shaders & HTML overlays
    description: Built-in visual generators, audio-reactive presets, and dynamic scoreboards via Qt WebEngine.
  - title: Panic controls & program output
    description: Blackout, freeze-frame, stay-tuned overlay, NDI output, recording, and OBS WebSocket integration.
useCases:
  - title: School events
    description: Instant highlight reels and replays during cricket, football, and assembly shows.
  - title: Live concerts
    description: Music videos, audio-reactive shader visuals, and custom graphics that sync with the beat.
  - title: Visual performances
    description: Dance, theater, and immersive installations with a dark VJ-style interface built for low light.
  - title: Sports broadcasting
    description: HTML/QML score overlays, freeze-frame holds, and program recording for match-day production.
features:
  - title: Source
    body: >-
      Video files, images, slideshows, webcams, screen/window capture, custom canvases,
      GLSL shaders, HTML/QML overlays, text, Lua-scripted sources, NDI inputs, and
      phone cameras over WebRTC.
    icon: source
  - title: Canvas
    body: >-
      Node-based clip canvas with groups, per-clip trim/crop/transform editing,
      text and image overlays, and drag-and-drop media loading.
    icon: canvas
  - title: Mix
    body: >-
      Live A/B deck mixing with crossfader, per-deck speed control, and a hotkey grid
      (1–0, Q–P, A–L, Z–M) with Shift variants for Deck B.
    icon: mix
  - title: Output
    body: >-
      Mirror windows, NDI program output, virtual camera, program recording with markers,
      OBS scene switching, remote control server, and panic controls.
    icon: output
specs:
