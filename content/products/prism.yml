slug: prism
name: Prism
tagline: Trigger. Mix. Create. Live.
status: live
version: "0.1.2"
platforms:
  - macOS
  - Windows
  - Linux
summary: >-
  A beginner-friendly live media trigger and overlay tool built with Qt 6, FFmpeg,
  and OpenGL. Wire sources through a node graph, remove backgrounds live with AI,
  and crossfade decks — perfect for school events, small concerts, and sports.
hero:
  headline: The beginner-friendly live trigger that feels like magic.
  subheadline: >-
    Instant clips. Beautiful overlays. Zero stress. Perfect for school events,
    small concerts, sports, and anywhere you want to look pro — without the headache.
highlights:
  - title: Node graph canvas
    description: Wire Input → Process → Layer → A/B Select → Output nodes with zoom, pan, and a minimap — no scenes or playlists to manage.
  - title: Live A/B deck mixing
    description: Crossfade between two decks with per-deck speed, AUTO/CUT, and transition modes — wipes, slides, dips, and 3D cube/flip.
  - title: AI background removal
    description: Key out a webcam's background live with a MediaPipe selfie-segmentation model via ONNX Runtime, composited over the layers below.
  - title: Phone camera over WebRTC
    description: Stream a smartphone camera into CutWire Prism over LAN or a public relay, paired by QR code.
  - title: GLSL shaders & HTML overlays
    description: Audio-reactive FFT shaders, built-in visual generators, and dynamic scoreboards via Qt WebEngine and Lua scripting.
  - title: Panic controls & program output
    description: Blackout, freeze-frame, stay-tuned overlay, NDI output, virtual camera, recording, and OBS WebSocket integration.
useCases:
  - title: School events
    description: Instant highlight reels and replays during cricket, football, and assembly shows.
  - title: Live concerts
    description: Music videos, audio-reactive shader visuals, and custom graphics that sync with the beat.
  - title: Visual performances
    description: Dance, theater, and immersive installations with a dark VJ-style interface built for low light.
  - title: Sports broadcasting
    description: HTML/QML score overlays, freeze-frame holds, and program recording for match-day production.
features:
  - title: Source
    body: >-
      Video files, images, slideshows, webcams, screen/window capture, custom canvases,
      GLSL shaders, HTML/QML overlays, text, Lua-scripted sources, NDI inputs, audio
      capture, and phone cameras over WebRTC.
    icon: source
  - title: Canvas
    body: >-
      A node graph canvas with Process nodes (crop, flip, and AI background removal)
      and Layer nodes that stack and lay out inputs with GPU compositing — plus
      per-source trim, transform, and text/image overlays.
    icon: canvas
  - title: Mix
    body: >-
      Live A/B deck mixing with a crossfader, per-deck speed, AUTO/CUT, and many
      transition modes (wipes, slides, dips, 3D cube/flip) with a hotkey grid
      (1–0, Q–P, A–L, Z–M) and Shift variants for Deck B.
    icon: mix
  - title: Output
    body: >-
      Configurable-resolution program output — mirror windows, NDI, virtual camera,
      program recording with markers, OBS scene switching, a remote control server,
      and panic controls.
    icon: output
